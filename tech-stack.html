  <script>

      theme: {
        extend: {
          colors: {
            primary: "var(--primary-color)",
            "primary-hover": "var(--primary-hover)",

            muted: "var(--text-muted)",
            circle: "var(--bg-circle)",

  <header class="navbar">
    <a href="index.html" class="logo">

    <nav class="nav-links">

  <main class="hero-section">
    <div class="hero-content max-w-[800px] mx-auto text-center">
      <h1 class="hero-title"><span class="highlight">Tech Stack</span></h1>
      <div class="tech-container mt-12 text-center">
        <!-- Languages -->
        <div class="tech-category">
          <h2 class="tech-category-title text-main text-2xl font-bold mb-6">
            Languages
          </h2>
          <div class="tech-grid flex flex-wrap justify-center gap-4">
            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">
              <img src="Image/new_java.png" alt="Java" class="tech-icon w-[46px] h-[46px] rounded-xl object-contain" />
              <span class="tech-name text-main font-semibold text-base pr-2">Java</span>
            </div>
            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">
              <img src="Image/new_python.png" alt="Python" class="tech-icon w-[46px] h-[46px] rounded-xl object-contain" />
              <span class="tech-name text-main font-semibold text-base pr-2">Python</span>
            </div>
            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">

            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">

              <span class="tech-name text-main font-semibold text-base pr-2">CSS</span>
            </div>
            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">
              <img src="Image/new_javascript.png" alt="JavaScript"
                class="tech-icon w-[46px] h-[46px] rounded-xl object-contain" />
              <span class="tech-name text-main font-semibold text-base pr-2">JavaScript</span>
            </div>
          </div>
        </div>

        <!-- Databases -->
        <div class="tech-category mt-12">
          <h2 class="tech-category-title text-main text-2xl font-bold mb-6">
            Databases
          </h2>
          <div class="tech-grid flex flex-wrap justify-center gap-4">
            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">
              <img src="Image/new_mysql.png" alt="MySQL" class="tech-icon w-[46px] h-[46px] rounded-xl object-contain" />
              <span class="tech-name text-main font-semibold text-base pr-2">MySQL</span>
            </div>
            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">

                class="tech-icon w-[46px] h-[46px] rounded-xl object-contain" />

              <span class="tech-name text-main font-semibold text-base pr-2">Oracle APEX</span>

          </div>
        </div>

        <div class="tech-category my-12">
          <h2 class="tech-category-title text-main text-2xl font-bold mb-6">

            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">

                class="tech-icon w-[46px] h-[46px] rounded-xl object-contain bg-transparent" />
              <span class="tech-name text-main font-semibold text-base pr-2">GitHub</span>

            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">

                class="tech-icon w-[46px] h-[46px] rounded-xl object-contain" />
              <span class="tech-name text-main font-semibold text-base pr-2">Android Studio</span>

            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">
              <img src="Image/new_vscode.png" alt="VS Code" class="tech-icon w-[46px] h-[46px] rounded-xl object-contain" />
              <span class="tech-name text-main font-semibold text-base pr-2">VS Code</span>
            </div>
            <div
              class="tech-card flex items-center gap-3 bg-circle py-2.5 pr-5 pl-2.5 rounded-2xl border border-black/5 transition-transform duration-200 hover:-translate-y-1">
              <img src="Image/new_sqlms22.png" alt="SQL Server Management Studio 22"
                class="tech-icon w-[46px] h-[46px] rounded-xl object-contain" />
              <span class="tech-name text-main font-semibold text-base pr-2">SQL Server Management Studio 22</span>
            </div>
          </div>
