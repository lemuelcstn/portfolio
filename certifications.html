    <div class="hero-content max-w-[800px] mx-auto text-center">
      <h1 class="hero-title">
        <span class="highlight">Certifications</span>
      </h1>
      <div class="certifications-container grid grid-cols-[repeat(auto-fit,minmax(280px,1fr))] gap-8 mt-12">
        <!-- Microsoft Word -->
        <div onclick="openModal(this)" data-title="Microsoft Word Certification" data-desc="Successfully earned the Microsoft Word Certification, demonstrating proficiency in document creation, formatting, and professional word processing." data-img="Image/mswordcert.jpg" data-link="https://www.credly.com/badges/797578f0-22d9-4119-b880-ea6142aabe54/public_url" class="group cursor-pointer flex flex-col items-center gap-6 p-8 bg-circle rounded-[24px] shadow-[0_10px_30px_rgba(0,0,0,0.05)] transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(0,123,255,0.15)]">
          <img src="Image/msword.png" alt="Microsoft Word Certification Badge"
            class="max-w-[180px] h-auto drop-shadow-[0_4px_10px_rgba(0,0,0,0.3)] pointer-events-none" />
          <h3 class="text-main font-semibold text-lg text-center transition-colors duration-300 group-hover:text-primary">
            Microsoft Word Certification
          </h3>
          <span class="inline-block py-[0.8rem] px-[1.8rem] bg-[#007bff] text-white rounded-[30px] font-semibold text-base transition-all duration-300 pointer-events-none group-hover:bg-[#0056b3] group-hover:scale-105">View Details</span>
        </div>
        <!-- Microsoft PowerPoint -->
        <div onclick="openModal(this)" data-title="Microsoft PowerPoint Certification" data-desc="Successfully earned the Microsoft PowerPoint Certification, demonstrating proficiency in creating dynamic presentations, slide designs, and professional slideshows." data-img="Image/mspowerpointcert.jpg" data-link="https://www.credly.com/badges/c20e4355-5381-4f27-8e46-6576989b7d1a/public_url" class="group cursor-pointer flex flex-col items-center gap-6 p-8 bg-circle rounded-[24px] shadow-[0_10px_30px_rgba(0,0,0,0.05)] transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(255,87,34,0.15)]">
          <img src="Image/mspowerpoint.png" alt="Microsoft PowerPoint Certification Badge"
            class="max-w-[180px] h-auto drop-shadow-[0_4px_10px_rgba(0,0,0,0.3)] pointer-events-none" />
          <h3 class="text-main font-semibold text-lg text-center transition-colors duration-300 group-hover:text-primary">
            Microsoft PowerPoint Certification
          </h3>
          <span class="inline-block py-[0.8rem] px-[1.8rem] bg-[#ff5722] text-white rounded-[30px] font-semibold text-base transition-all duration-300 pointer-events-none group-hover:bg-[#e64a19] group-hover:scale-105">View Details</span>
        </div>
        <!-- Networking Basics -->
        <div onclick="openModal(this)" data-title="Networking Basics Certification" data-desc="Successfully earned the Networking Basics Certification, demonstrating fundamental knowledge in networking concepts, protocols, and infrastructure." data-img="Image/networkingbasicscert.jpg" data-link="https://www.credly.com/badges/b9f30873-d537-486d-a6ca-573da0a4af67/public_url" class="group cursor-pointer flex flex-col items-center gap-6 p-8 bg-circle rounded-[24px] shadow-[0_10px_30px_rgba(0,0,0,0.05)] transition-all duration-300 hover:-translate-y-2 hover:shadow-[0_20px_40px_rgba(0,188,212,0.15)]">

            class="max-w-[180px] h-auto drop-shadow-[0_4px_10px_rgba(0,0,0,0.3)] pointer-events-none" />

            Networking Basics Certification
